<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Name | Links</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <button class="theme-btn" onclick="toggleTheme()">🌙</button>

    <main class="container">

        <div class="profile">
            <div class="avatar">YN</div>

            <h1>Your Name</h1>

            <p class="username">@yourusername</p>

            <p class="bio">
                Welcome to my page 👋<br>
                Find all my important links below.
            </p>
        </div>

        <div class="links">

            <a href="https://github.com/" target="_blank" class="link">
                <span>💻</span>
                <p>GitHub</p>
                <span>→</span>
            </a>

            <a href="https://www.instagram.com/" target="_blank" class="link">
                <span>📸</span>
                <p>Instagram</p>
                <span>→</span>
            </a>

            <a href="https://www.tiktok.com/" target="_blank" class="link">
                <span>🎵</span>
                <p>TikTok</p>
                <span>→</span>
            </a>

            <a href="https://wa.me/" target="_blank" class="link">
                <span>💬</span>
                <p>WhatsApp</p>
                <span>→</span>
            </a>

            <a href="#" class="link">
                <span>🛍️</span>
                <p>My Store</p>
                <span>→</span>
            </a>

        </div>

        <footer>
            <p>Made with ❤️ and HTML, CSS & JavaScript</p>
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
